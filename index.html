<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Scalp Quiz</title>
<script src="https://unpkg.com/lightweight-charts@4.1.3/dist/lightweight-charts.standalone.production.js"></script>
<style>
  :root {
    --bg: #0a0e14;
    --bg-elev: #131820;
    --bg-elev2: #1a2030;
    --border: #2a3140;
    --text: #d8dee9;
    --text-dim: #8893a8;
    --green: #22c55e;
    --red: #ef4444;
    --green-dim: #14532d;
    --red-dim: #7f1d1d;
    --yellow: #f6c143;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; padding: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    -webkit-font-smoothing: antialiased;
    overflow: hidden;
    height: 100vh;
  }
  #app {
    display: flex;
    flex-direction: column;
    height: 100vh;
    max-width: 720px;
    margin: 0 auto;
    padding: 8px;
    gap: 8px;
  }
  /* ========== TOP STATUS BAR ========== */
  #topbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    padding: 6px 10px;
    background: var(--bg-elev);
    border: 1px solid var(--border);
    border-radius: 6px;
    font-size: 13px;
  }
  #topbar .title {
    font-weight: 700;
    color: var(--yellow);
    font-size: 14px;
  }
  #stats {
    display: flex;
    gap: 12px;
    font-family: Consolas, monospace;
    color: var(--text-dim);
    font-size: 12px;
  }
  #stats .stat { white-space: nowrap; }
  #stats .stat strong {
    color: var(--text);
    font-weight: 700;
  }
  /* ========== QUESTION HEADER ========== */
  #question-info {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 4px 12px;
    font-family: Consolas, monospace;
    font-size: 14px;
    color: var(--text);
  }
  #question-info .ticker {
    font-size: 18px;
    font-weight: 700;
    color: var(--yellow);
  }
  #question-info .time {
    color: var(--text-dim);
  }
  /* ========== CHART ========== */
  #chart-wrap {
    flex: 1 1 auto;
    position: relative;
    background: #000;
    border: 1px solid var(--border);
    border-radius: 6px;
    overflow: hidden;
    min-height: 260px;
  }
  #chart { width: 100%; height: 100%; }
  /* Vertical cursor line drawn at T after the user answers */
  #cursor-line {
    position: absolute;
    top: 0; bottom: 0;
    width: 0;
    border-left: 2px dashed var(--yellow);
    pointer-events: none;
    z-index: 5;
    display: none;
  }
  #cursor-line.show { display: block; }
  #cursor-label {
    position: absolute;
    top: 6px;
    transform: translateX(-50%);
    padding: 2px 6px;
    background: var(--yellow);
    color: #000;
    font-family: Consolas, monospace;
    font-size: 10px;
    font-weight: 700;
    border-radius: 3px;
    pointer-events: none;
    z-index: 5;
    display: none;
  }
  #cursor-label.show { display: block; }
  #loading-overlay {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    background: rgba(0,0,0,0.7);
    color: var(--text-dim);
    font-size: 14px;
    z-index: 10;
    pointer-events: none;
  }
  #loading-overlay.hidden { display: none; }
  /* ========== RESULT BANNER ========== */
  #result-banner {
    display: none;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    padding: 8px 12px;
    border-radius: 6px;
    font-family: Consolas, monospace;
    font-size: 13px;
  }
  #result-banner.show { display: flex; }
  #result-banner.correct { background: var(--green-dim); color: #bbf7d0; border: 1px solid var(--green); }
  #result-banner.wrong   { background: var(--red-dim);   color: #fecaca; border: 1px solid var(--red); }
  #result-banner.multi   { background: var(--bg-elev); color: var(--text); border: 1px solid var(--border); flex-direction: column; align-items: stretch; padding: 6px 8px; }
  /* Multi-horizon result table */
  #multi-table { width: 100%; border-collapse: collapse; font-family: Consolas, monospace; font-size: 12px; }
  #multi-table th, #multi-table td { padding: 4px 6px; text-align: right; border-bottom: 1px solid var(--border); }
  #multi-table th { color: var(--text-dim); font-weight: 600; }
  #multi-table td:first-child, #multi-table th:first-child { text-align: left; }
  #multi-table tr.correct td.check { color: var(--green); font-weight: 700; }
  #multi-table tr.wrong   td.check { color: var(--red);   font-weight: 700; }
  #multi-table tr.na      td       { color: var(--text-dim); }
  #multi-table td.up   { color: var(--green); }
  #multi-table td.down { color: var(--red); }
  #multi-summary {
    margin-top: 4px;
    font-family: Consolas, monospace;
    font-size: 12px;
    text-align: right;
    color: var(--text-dim);
  }
  #multi-summary strong { color: var(--text); }
  /* ========== CONTROLS ========== */
  #controls {
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .horizon-row {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 4px 8px;
  }
  .horizon-row label {
    color: var(--text-dim);
    font-size: 13px;
  }
  .horizon-row select {
    flex: 1;
    background: var(--bg-elev2);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 5px;
    padding: 8px;
    font-size: 14px;
    font-family: inherit;
    outline: none;
  }
  .answer-row {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
  }
  .answer-btn {
    padding: 18px;
    border-radius: 8px;
    border: 2px solid;
    font-size: 18px;
    font-weight: 700;
    cursor: pointer;
    transition: transform 0.05s, opacity 0.15s;
    font-family: inherit;
    color: #fff;
    user-select: none;
  }
  .answer-btn:active { transform: scale(0.97); }
  .answer-btn.up   { background: var(--green); border-color: var(--green); }
  .answer-btn.down { background: var(--red);   border-color: var(--red); }
  .answer-btn:disabled {
    opacity: 0.4;
    cursor: not-allowed;
  }
  #next-btn {
    display: none;
    padding: 18px;
    border-radius: 8px;
    background: var(--yellow);
    color: #000;
    font-size: 18px;
    font-weight: 800;
    border: none;
    cursor: pointer;
    font-family: inherit;
    width: 100%;
  }
  #next-btn.show { display: block; }
  #next-btn:active { transform: scale(0.97); }
  /* ========== FOOTER ========== */
  #footer {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 4px 8px;
    font-size: 11px;
    color: var(--text-dim);
  }
  #footer a, #footer button {
    background: none;
    border: none;
    color: var(--text-dim);
    text-decoration: underline;
    cursor: pointer;
    font: inherit;
    padding: 0;
  }
  #footer button:hover { color: var(--text); }
  @media (max-width: 480px) {
    #app { padding: 6px; gap: 6px; }
    #topbar { font-size: 12px; padding: 5px 8px; }
    #stats { gap: 8px; font-size: 11px; }
    #question-info { font-size: 13px; padding: 2px 8px; }
    #question-info .ticker { font-size: 16px; }
    .answer-btn { padding: 14px; font-size: 16px; }
    #next-btn { padding: 14px; font-size: 16px; }
  }
</style>
</head>
<body>

<div id="app">
  <div id="topbar">
    <span class="title">SCALP QUIZ</span>
    <div id="stats">
      <span class="stat"><strong id="stat-acc">--%</strong> acc</span>
      <span class="stat"><strong id="stat-total">0</strong> q</span>
      <span class="stat">streak <strong id="stat-streak">0</strong></span>
    </div>
  </div>

  <div id="question-info">
    <span class="ticker" id="q-ticker">--</span>
    <span class="time" id="q-time">--:--</span>
  </div>

  <div id="chart-wrap">
    <div id="chart"></div>
    <div id="cursor-line"></div>
    <div id="cursor-label">YOU GUESSED</div>
    <div id="loading-overlay">Loading session...</div>
  </div>

  <div id="result-banner">
    <span id="result-verdict"></span>
    <span id="result-detail"></span>
  </div>

  <div id="controls">
    <div class="horizon-row">
      <label for="mode-sel">Mode</label>
      <select id="mode-sel">
        <option value="single" selected>Single horizon (scored)</option>
        <option value="multi">Multi-horizon table (unscored)</option>
      </select>
    </div>
    <div class="horizon-row">
      <label for="bucket-sel">Candle size</label>
      <select id="bucket-sel">
        <option value="30">30 sec</option>
        <option value="60" selected>1 min</option>
        <option value="300">5 min</option>
        <option value="600">10 min</option>
        <option value="3600">Hourly</option>
      </select>
    </div>
    <div class="horizon-row" id="horizon-row-single">
      <label for="horizon-sel">Predict direction in</label>
      <select id="horizon-sel">
        <option value="5">5 min</option>
        <option value="10">10 min</option>
        <option value="30" selected>30 min</option>
        <option value="60">1 hour</option>
      </select>
    </div>
    <div class="answer-row">
      <button class="answer-btn up"   id="btn-up">UP</button>
      <button class="answer-btn down" id="btn-down">DOWN</button>
    </div>
    <button id="next-btn">NEXT QUESTION</button>
  </div>

  <div id="footer">
    <span>Public data via <a href="https://lenibi.github.io/scalp-sim/" target="_blank" rel="noopener">scalp-sim</a></span>
    <button id="reset-stats-btn" title="Reset all-time stats">reset stats</button>
  </div>
</div>

<script>
'use strict';

// ============================================================
// CONFIG
// ============================================================
const DATA_BASE = 'https://lenibi.github.io/scalp-sim/data';
const CATALOG_FILE = 'sessions_catalog_1min.json';
const DAYS_DIR = 'days_1min';
const TICKERS = ['SOXL', 'MSTR', 'COIN', 'NVDA', 'TQQQ', 'TSLA'];   // all 6 from V7-CD universe
const CONTEXT_DAYS = 4;                 // walk back N prior trading days
const INITIAL_VIEW_HOURS = 24;          // default chart shows last 24h before T (user can zoom out)
const NEUTRAL_THRESHOLD_PCT = 0.10;
const RTH_START_MIN = 9 * 60 + 35;
const LS_STATS_KEY  = 'scalp_quiz_stats_v1';
const LS_BUCKET_KEY = 'scalp_quiz_bucket_seconds';
const LS_MODE_KEY = 'scalp_quiz_mode';
// Mutable: user can change this via the bucket dropdown. Source data is 1-min,
// so values below 60 just produce identical-OHLC bars (no extra detail).
let BUCKET_SECONDS = parseInt(localStorage.getItem(LS_BUCKET_KEY) || '60', 10);
let MODE = localStorage.getItem(LS_MODE_KEY) || 'single';   // 'single' | 'multi'

// Horizons checked in multi-horizon mode. Each tuple: [label, seconds_from_T].
// 'close' is special-cased -- horizon ends at 15:55 ET same day.
const MULTI_HORIZONS = [
  { label: '10 min',  sec:  10 * 60 },
  { label: '30 min',  sec:  30 * 60 },
  { label: '1 hour',  sec:  60 * 60 },
  { label: '2 hour',  sec: 120 * 60 },
  { label: '3 hour',  sec: 180 * 60 },
  { label: '4 hour',  sec: 240 * 60 },
  { label: 'Close',   sec:  null     },   // 15:55 ET same day
];

// ============================================================
// STATE
// ============================================================
let CATALOG = null;
let chart = null;
let candleSeries = null;
let vwapSeries = null;
let upperSeries = null;
let lowerSeries = null;
let currentQ = null;
let answered = false;
let stats = loadStats();

// ============================================================
// STATS
// ============================================================
function loadStats() {
  try {
    const s = JSON.parse(localStorage.getItem(LS_STATS_KEY)) || {};
    return {
      total:   s.total   || 0,
      correct: s.correct || 0,
      streak:  s.streak  || 0,
      bestStreak: s.bestStreak || 0,
      byHorizon: s.byHorizon || {},
      byTicker:  s.byTicker  || {},
    };
  } catch (e) {
    return { total: 0, correct: 0, streak: 0, bestStreak: 0, byHorizon: {}, byTicker: {} };
  }
}
function saveStats() { localStorage.setItem(LS_STATS_KEY, JSON.stringify(stats)); }
function renderStats() {
  document.getElementById('stat-total').textContent = stats.total;
  document.getElementById('stat-streak').textContent = stats.streak;
  const acc = stats.total === 0 ? '--' : Math.round(100 * stats.correct / stats.total);
  document.getElementById('stat-acc').textContent = acc + '%';
}
function recordResult(correct, horizon, ticker) {
  stats.total++;
  if (correct) {
    stats.correct++;
    stats.streak++;
    if (stats.streak > stats.bestStreak) stats.bestStreak = stats.streak;
  } else {
    stats.streak = 0;
  }
  const hKey = String(horizon);
  if (!stats.byHorizon[hKey]) stats.byHorizon[hKey] = { q: 0, c: 0 };
  stats.byHorizon[hKey].q++;
  if (correct) stats.byHorizon[hKey].c++;
  if (!stats.byTicker[ticker]) stats.byTicker[ticker] = { q: 0, c: 0 };
  stats.byTicker[ticker].q++;
  if (correct) stats.byTicker[ticker].c++;
  saveStats();
  renderStats();
}

// ============================================================
// DATA FETCH
// ============================================================
async function loadCatalog() {
  if (CATALOG) return CATALOG;
  const r = await fetch(DATA_BASE + '/' + CATALOG_FILE);
  if (!r.ok) throw new Error('catalog fetch failed: ' + r.status);
  // Catalog has both 5-sec and 1-min entries; we want the 1-min variant.
  CATALOG = (await r.json()).filter(s => TICKERS.includes(s.ticker));
  return CATALOG;
}
const _dayCache = new Map();
async function loadDay(ticker, date) {
  const key = ticker + '_' + date;
  if (_dayCache.has(key)) return _dayCache.get(key);
  const r = await fetch(DATA_BASE + '/' + DAYS_DIR + '/' + key + '.json');
  if (!r.ok) throw new Error('day fetch failed: ' + key);
  const bars = await r.json();
  _dayCache.set(key, bars);
  return bars;
}

// ============================================================
// CHART
// ============================================================
function initChart() {
  chart = LightweightCharts.createChart(document.getElementById('chart'), {
    layout: { background: { color: '#000' }, textColor: '#cccccc' },
    grid: {
      vertLines: { color: '#15191f', style: 2 },
      horzLines: { color: '#15191f', style: 2 },
    },
    rightPriceScale: {
      borderColor: '#2a3140',
      scaleMargins: { top: 0.08, bottom: 0.08 },
    },
    timeScale: {
      borderColor: '#2a3140',
      timeVisible: true,
      secondsVisible: false,
      minBarSpacing: 0.05,    // allow extreme zoom-out so 4 days fit on screen
    },
    crosshair: { mode: LightweightCharts.CrosshairMode.Normal },
    handleScroll: true,
    handleScale: true,
  });
  candleSeries = chart.addCandlestickSeries({
    upColor: '#22c55e', downColor: '#ef4444',
    borderUpColor: '#22c55e', borderDownColor: '#ef4444',
    wickUpColor: '#22c55e', wickDownColor: '#ef4444',
    priceLineVisible: false,
    lastValueVisible: true,
  });
  // VWAP series setup happens via a per-DAY pool. First triplet created
  // up front; more added lazily as multi-day context expands the day count.
  vwapSeries = chart.addLineSeries({
    color: '#f6c143', lineWidth: 1,
    lineStyle: LightweightCharts.LineStyle.Dashed,
    priceLineVisible: false, crosshairMarkerVisible: false,
    lastValueVisible: false,
  });
  upperSeries = chart.addLineSeries({
    color: '#66aaff', lineWidth: 1,
    priceLineVisible: false, crosshairMarkerVisible: false,
    lastValueVisible: false,
  });
  lowerSeries = chart.addLineSeries({
    color: '#ff77bb', lineWidth: 1,
    priceLineVisible: false, crosshairMarkerVisible: false,
    lastValueVisible: false,
  });
  VWAP_DAY_POOL.push({ vwap: vwapSeries, upper: upperSeries, lower: lowerSeries });
  // Keep the cursor line glued to T when the user pans/zooms the chart.
  chart.timeScale().subscribeVisibleTimeRangeChange(() => {
    if (answered && currentQ) drawCursorLine(currentQ.T);
  });
  // Also reposition on window resize.
  window.addEventListener('resize', () => {
    if (answered && currentQ) drawCursorLine(currentQ.T);
  });
}

// One {vwap, upper, lower} triplet per RTH day visible on the chart, so
// lightweight-charts physically cannot draw a line across overnight gaps.
const VWAP_DAY_POOL = [];
function _ensureVwapDay(idx) {
  while (VWAP_DAY_POOL.length <= idx) {
    VWAP_DAY_POOL.push({
      vwap:  chart.addLineSeries({ color: '#f6c143', lineWidth: 1,
        lineStyle: LightweightCharts.LineStyle.Dashed,
        priceLineVisible: false, crosshairMarkerVisible: false, lastValueVisible: false }),
      upper: chart.addLineSeries({ color: '#66aaff', lineWidth: 1,
        priceLineVisible: false, crosshairMarkerVisible: false, lastValueVisible: false }),
      lower: chart.addLineSeries({ color: '#ff77bb', lineWidth: 1,
        priceLineVisible: false, crosshairMarkerVisible: false, lastValueVisible: false }),
    });
  }
  return VWAP_DAY_POOL[idx];
}

// Per-day rolling-window VWAP + ±2sigma bands. Each day's RTH segment
// goes on its own line series so no line ever crosses an overnight gap.
function _vwapBandsByDay(candles) {
  const WINDOW_BARS = 15;
  const SIGMA_MULT = 2;
  const MIN_BARS = 5;
  const days = new Map();
  // First group RTH candles by ET date so each day has its own rolling state.
  for (const c of candles) {
    const d = new Date(c.time * 1000);
    const mod = d.getUTCHours() * 60 + d.getUTCMinutes();
    const inRTH = mod >= 9 * 60 + 30 && mod < 16 * 60;
    if (!inRTH) continue;
    const key = d.getUTCFullYear() + '-' + d.getUTCMonth() + '-' + d.getUTCDate();
    if (!days.has(key)) days.set(key, []);
    days.get(key).push(c);
  }
  // For each day, compute the rolling-window VWAP+bands.
  const segments = [];
  const sortedKeys = Array.from(days.keys()).sort((a, b) => {
    // Sort by the first bar's time for deterministic ordering.
    return days.get(a)[0].time - days.get(b)[0].time;
  });
  for (const key of sortedKeys) {
    const dayBars = days.get(key);
    const queue = [];
    let sumPV = 0, sumV = 0, sumP2V = 0;
    const seg = { vwap: [], upper: [], lower: [] };
    for (const c of dayBars) {
      const typical = (c.high + c.low + c.close) / 3;
      const v = 1;
      const pv = typical * v;
      const p2v = typical * typical * v;
      queue.push({ pv, v, p2v });
      sumPV += pv; sumV += v; sumP2V += p2v;
      if (queue.length > WINDOW_BARS) {
        const old = queue.shift();
        sumPV -= old.pv; sumV -= old.v; sumP2V -= old.p2v;
      }
      if (queue.length < MIN_BARS || sumV <= 0) continue;
      const m = sumPV / sumV;
      const variance = Math.max(0, sumP2V / sumV - m * m);
      const sigma = Math.sqrt(variance);
      seg.vwap.push({ time: c.time, value: m });
      seg.upper.push({ time: c.time, value: m + SIGMA_MULT * sigma });
      seg.lower.push({ time: c.time, value: m - SIGMA_MULT * sigma });
    }
    segments.push(seg);
  }
  return segments;
}

function setVwapData(candles) {
  // Wipe ALL pool series first.
  for (const t of VWAP_DAY_POOL) {
    t.vwap.setData([]);
    t.upper.setData([]);
    t.lower.setData([]);
  }
  // Then populate one triplet per day.
  const segments = _vwapBandsByDay(candles);
  for (let i = 0; i < segments.length; i++) {
    const t = _ensureVwapDay(i);
    t.vwap.setData(segments[i].vwap);
    t.upper.setData(segments[i].upper);
    t.lower.setData(segments[i].lower);
  }
}

// ============================================================
// BAR HELPERS (5-sec source bars use FAKE-UTC encoding from scalp-sim)
// ============================================================
function aggregateToBucket(bars, bucketSec) {
  const out = [];
  let cur = null;
  for (const b of bars) {
    const bucket = Math.floor(b.t / bucketSec) * bucketSec;
    if (!cur || cur.time !== bucket) {
      if (cur) out.push(cur);
      cur = { time: bucket, open: b.o, high: b.h, low: b.l, close: b.c };
    } else {
      cur.high = Math.max(cur.high, b.h);
      cur.low  = Math.min(cur.low,  b.l);
      cur.close = b.c;
    }
  }
  if (cur) out.push(cur);
  return out;
}
function etMinuteOfDay(t) {
  const d = new Date(t * 1000);
  return d.getUTCHours() * 60 + d.getUTCMinutes();
}
function fmtETTime(t) {
  const d = new Date(t * 1000);
  let h = d.getUTCHours();
  const m = d.getUTCMinutes();
  const ampm = h >= 12 ? 'PM' : 'AM';
  h = h % 12; if (h === 0) h = 12;
  return h + ':' + String(m).padStart(2, '0') + ' ' + ampm;
}

// ============================================================
// QUESTION GENERATION
// ============================================================
function getHorizon() {
  return parseInt(document.getElementById('horizon-sel').value, 10);
}
function pickRandomSession() {
  return CATALOG[Math.floor(Math.random() * CATALOG.length)];
}
function priorTradingDates(ticker, date, n) {
  // Walk the catalog's prev_date chain back N hops from `date`.
  // Returns oldest-first so concatenation preserves chronological order.
  const out = [];
  let cur = date;
  for (let i = 0; i < n; i++) {
    const entry = CATALOG.find(s => s.ticker === ticker && s.date === cur);
    if (!entry || !entry.prev_date) break;
    out.push(entry.prev_date);
    cur = entry.prev_date;
  }
  return out.reverse();
}
async function generateQuestion(maxAttempts = 8) {
  const horizonMin = getHorizon();
  const TMaxMinute = 16 * 60 - horizonMin;
  const TMinMinute = RTH_START_MIN;
  for (let attempt = 0; attempt < maxAttempts; attempt++) {
    const session = pickRandomSession();
    let bars;
    try { bars = await loadDay(session.ticker, session.date); }
    catch (e) { continue; }
    if (!bars || bars.length === 0) continue;
    const candidates = bars.filter(b => {
      const mod = etMinuteOfDay(b.t);
      return mod >= TMinMinute && mod <= TMaxMinute;
    });
    if (candidates.length < 5) continue;
    const cursor = candidates[Math.floor(Math.random() * candidates.length)];
    const T = cursor.t;
    const priceAtT = cursor.c;
    const targetTs = T + horizonMin * 60;
    let outcomeBar = null;
    for (const b of bars) {
      if (b.t >= targetTs) { outcomeBar = b; break; }
    }
    if (!outcomeBar) continue;
    const priceAfter = outcomeBar.c;
    const pct = (priceAfter - priceAtT) / priceAtT * 100;
    if (Math.abs(pct) < NEUTRAL_THRESHOLD_PCT) continue;
    const actualUp = pct > 0;
    // Load N prior trading days as additional context.
    const priorDates = priorTradingDates(session.ticker, session.date, CONTEXT_DAYS);
    const priorBars = [];
    for (const d of priorDates) {
      try {
        const dayBars = await loadDay(session.ticker, d);
        priorBars.push(...dayBars);
      } catch (e) {
        // Day file missing -- skip silently, fewer days of context is OK.
      }
    }
    // Today's bars up to T (the cursor moment).
    const todayUpToT = bars.filter(b => b.t <= T);
    // Concat & dedupe by timestamp (adjacent day files can overlap ~20 min near 4 AM).
    const seen = new Set();
    const contextBars = [];
    for (const b of priorBars.concat(todayUpToT)) {
      if (seen.has(b.t)) continue;
      seen.add(b.t);
      contextBars.push(b);
    }
    if (contextBars.length < 20) continue;
    // futureBars now extends to the END OF TODAY'S DATA (not just the
    // outcome horizon) so reveal shows the rest of the day after the guess.
    const futureBars = bars.filter(b => b.t > T);
    return {
      ticker: session.ticker,
      date: session.date,
      T,
      horizonMin,
      priceAtT,
      priceAfter,
      pct,
      actualUp,
      contextBars,
      futureBars,
      todayBars: bars,    // full today bars, used for multi-horizon outcome lookup
    };
  }
  return null;
}

// ============================================================
// RENDER
// ============================================================
function setLoading(text) {
  const el = document.getElementById('loading-overlay');
  if (text) { el.textContent = text; el.classList.remove('hidden'); }
  else      { el.classList.add('hidden'); }
}
function renderQuestion(q) {
  hideCursorLine();
  document.getElementById('q-ticker').textContent = q.ticker;
  document.getElementById('q-time').textContent = fmtETTime(q.T);
  const candles = aggregateToBucket(q.contextBars, BUCKET_SECONDS);
  candleSeries.setData(candles);
  setVwapData(candles);
  // Default visible window: last ~24h before T. User can pinch out to see
  // the full 4-day context. (Skipping fitContent() because with 4 days of
  // 1-min candles, fitContent squishes everything too small to read.)
  try {
    chart.timeScale().setVisibleRange({
      from: q.T - INITIAL_VIEW_HOURS * 3600,
      to:   q.T + 30 * 60,
    });
  } catch (e) {
    chart.timeScale().fitContent();
  }
  document.getElementById('result-banner').className = '';
  document.getElementById('result-verdict').textContent = '';
  document.getElementById('result-detail').textContent = '';
  document.getElementById('next-btn').className = '';
  document.getElementById('btn-up').disabled = false;
  document.getElementById('btn-down').disabled = false;
  answered = false;
}
// Returns the price at-or-just-after target_t in todayBars. null if none.
function _priceAtOrAfter(bars, target_t) {
  for (const b of bars) {
    if (b.t >= target_t) return b.c;
  }
  return null;
}
// 3:55 PM ET close for the day containing T (fake-UTC convention -> just set
// UTC HH:MM on the same calendar day). Returns ts or null.
function _closeTsOf(T) {
  const d = new Date(T * 1000);
  const close = new Date(Date.UTC(d.getUTCFullYear(), d.getUTCMonth(), d.getUTCDate(), 15, 55, 0));
  return Math.floor(close.getTime() / 1000);
}
function _renderMultiTable(userSaidUp) {
  const banner = document.getElementById('result-banner');
  // Remove single-mode markers/classes; switch to multi layout.
  banner.className = '';
  banner.classList.add('show', 'multi');
  // Clear existing inner children, then rebuild as table.
  while (banner.firstChild) banner.removeChild(banner.firstChild);
  const table = document.createElement('table');
  table.id = 'multi-table';
  const head = document.createElement('thead');
  const trh = document.createElement('tr');
  for (const h of ['Horizon', 'Then', '% move', 'Your call']) {
    const th = document.createElement('th');
    th.textContent = h;
    trh.appendChild(th);
  }
  head.appendChild(trh);
  table.appendChild(head);
  const body = document.createElement('tbody');
  let correctCount = 0, totalChecked = 0;
  for (const h of MULTI_HORIZONS) {
    const tr = document.createElement('tr');
    const target_t = (h.sec === null) ? _closeTsOf(currentQ.T) : currentQ.T + h.sec;
    const priceAtH = _priceAtOrAfter(currentQ.todayBars, target_t);
    // Build cells
    const cLabel = document.createElement('td'); cLabel.textContent = h.label; tr.appendChild(cLabel);
    const cDir   = document.createElement('td');
    const cPct   = document.createElement('td');
    const cChk   = document.createElement('td');
    cChk.className = 'check';
    if (priceAtH === null) {
      cDir.textContent = '-'; cPct.textContent = '-'; cChk.textContent = 'n/a';
      tr.classList.add('na');
    } else {
      const pct = (priceAtH - currentQ.priceAtT) / currentQ.priceAtT * 100;
      const wentUp = pct > 0.05;       // small threshold to avoid noise calls
      const wentDown = pct < -0.05;
      cDir.textContent = wentUp ? '▲' : (wentDown ? '▼' : '·');
      cDir.className = wentUp ? 'up' : (wentDown ? 'down' : '');
      cPct.textContent = (pct >= 0 ? '+' : '') + pct.toFixed(2) + '%';
      const userCorrect = (userSaidUp && wentUp) || (!userSaidUp && wentDown);
      const userWrong   = (userSaidUp && wentDown) || (!userSaidUp && wentUp);
      if (userCorrect) {
        cChk.textContent = '✓';
        tr.classList.add('correct');
        correctCount++; totalChecked++;
      } else if (userWrong) {
        cChk.textContent = '✗';
        tr.classList.add('wrong');
        totalChecked++;
      } else {
        cChk.textContent = '~';   // flat / inconclusive
      }
    }
    tr.appendChild(cDir); tr.appendChild(cPct); tr.appendChild(cChk);
    body.appendChild(tr);
  }
  table.appendChild(body);
  banner.appendChild(table);
  // Summary row
  const summary = document.createElement('div');
  summary.id = 'multi-summary';
  const yourPick = userSaidUp ? 'UP' : 'DOWN';
  summary.innerHTML = '';   // intentionally empty before populating safely
  const yp = document.createElement('strong'); yp.textContent = 'You said ' + yourPick;
  summary.appendChild(yp);
  summary.appendChild(document.createTextNode(' · correct at '));
  const score = document.createElement('strong');
  score.textContent = correctCount + '/' + totalChecked;
  summary.appendChild(score);
  summary.appendChild(document.createTextNode(' horizons'));
  banner.appendChild(summary);
}
function revealOutcome(userSaidUp) {
  const all = currentQ.contextBars.concat(currentQ.futureBars);
  const candles = aggregateToBucket(all, BUCKET_SECONDS);
  candleSeries.setData(candles);
  setVwapData(candles);
  // Reveal zoom: from 3h before T through end of today's data.
  const todayBars = currentQ.todayBars || all;
  const lastT = todayBars[todayBars.length - 1].t;
  try {
    chart.timeScale().setVisibleRange({
      from: currentQ.T - 3 * 3600,
      to:   Math.max(lastT, currentQ.T + 60 * 60),
    });
  } catch (e) {
    chart.timeScale().fitContent();
  }
  if (MODE === 'multi') {
    _renderMultiTable(userSaidUp);
    // No stats updated in multi mode -- unscored.
  } else {
    const correct = userSaidUp === currentQ.actualUp;
    recordResult(correct, currentQ.horizonMin, currentQ.ticker);
    const banner = document.getElementById('result-banner');
    // Reset banner content layout to single mode.
    while (banner.firstChild) banner.removeChild(banner.firstChild);
    const verdict = document.createElement('span'); verdict.id = 'result-verdict';
    const detail = document.createElement('span'); detail.id = 'result-detail';
    banner.appendChild(verdict); banner.appendChild(detail);
    banner.className = '';
    banner.classList.add('show', correct ? 'correct' : 'wrong');
    verdict.textContent = correct ? 'Correct' : 'Wrong';
    const pctStr = (currentQ.pct >= 0 ? '+' : '') + currentQ.pct.toFixed(2) + '%';
    const yourPick = userSaidUp ? 'UP' : 'DOWN';
    const truth = currentQ.actualUp ? 'UP' : 'DOWN';
    detail.textContent = 'You: ' + yourPick + ' | Actual: ' + truth + ' (' + pctStr + ')';
  }
  // Draw the cursor vertical line at T.
  drawCursorLine(currentQ.T);
  document.getElementById('btn-up').disabled = true;
  document.getElementById('btn-down').disabled = true;
  document.getElementById('next-btn').classList.add('show');
  answered = true;
}

// Cursor line: a yellow dashed vertical line at T after the user answers.
function drawCursorLine(t) {
  const line = document.getElementById('cursor-line');
  const label = document.getElementById('cursor-label');
  if (!line || !label) return;
  const x = chart.timeScale().timeToCoordinate(t);
  if (x === null || x === undefined) {
    line.classList.remove('show');
    label.classList.remove('show');
    return;
  }
  // Chart canvas sits inside #chart-wrap; the chart's price-axis is at the
  // RIGHT of the canvas. Position relative to chart-wrap.
  line.style.left = x + 'px';
  label.style.left = x + 'px';
  line.classList.add('show');
  label.classList.add('show');
}
function hideCursorLine() {
  const line = document.getElementById('cursor-line');
  const label = document.getElementById('cursor-label');
  if (line) line.classList.remove('show');
  if (label) label.classList.remove('show');
}

// ============================================================
// FLOW
// ============================================================
async function nextQuestion() {
  setLoading('Loading next session...');
  const q = await generateQuestion();
  if (!q) {
    setLoading('Could not find a question. Try a shorter horizon.');
    return;
  }
  currentQ = q;
  renderQuestion(q);
  setLoading(null);
}
document.getElementById('btn-up').addEventListener('click', () => {
  if (answered || !currentQ) return;
  revealOutcome(true);
});
document.getElementById('btn-down').addEventListener('click', () => {
  if (answered || !currentQ) return;
  revealOutcome(false);
});
document.getElementById('next-btn').addEventListener('click', () => { nextQuestion(); });
document.getElementById('horizon-sel').addEventListener('change', () => {
  if (!answered) nextQuestion();
});

// Bucket-size dropdown: re-aggregate current question's bars at the new
// bucket and redraw, without picking a new question. Persists in localStorage.
function _redrawAtCurrentBucket() {
  if (!currentQ) return;
  const bars = answered
    ? currentQ.contextBars.concat(currentQ.futureBars)
    : currentQ.contextBars;
  const candles = aggregateToBucket(bars, BUCKET_SECONDS);
  candleSeries.setData(candles);
  setVwapData(candles);
  // Re-apply the appropriate visible range so the user stays anchored.
  const target = answered
    ? { from: currentQ.T - 3 * 3600, to: currentQ.T + (currentQ.horizonMin + 30) * 60 }
    : { from: currentQ.T - INITIAL_VIEW_HOURS * 3600, to: currentQ.T + 30 * 60 };
  try { chart.timeScale().setVisibleRange(target); } catch (e) {}
}
const _bucketSel = document.getElementById('bucket-sel');
if (_bucketSel) {
  _bucketSel.value = String(BUCKET_SECONDS);
  _bucketSel.addEventListener('change', e => {
    const v = parseInt(e.target.value, 10);
    if (!v || v <= 0) return;
    BUCKET_SECONDS = v;
    localStorage.setItem(LS_BUCKET_KEY, String(v));
    _redrawAtCurrentBucket();
  });
}

// Mode dropdown: 'single' vs 'multi'. In multi mode, hide the horizon
// dropdown (since multiple horizons are evaluated) and don't update stats.
function _applyMode() {
  const row = document.getElementById('horizon-row-single');
  if (row) row.style.display = (MODE === 'multi') ? 'none' : '';
}
const _modeSel = document.getElementById('mode-sel');
if (_modeSel) {
  _modeSel.value = MODE;
  _applyMode();
  _modeSel.addEventListener('change', e => {
    MODE = e.target.value;
    localStorage.setItem(LS_MODE_KEY, MODE);
    _applyMode();
    // If a question is currently displayed and unanswered, the bar set is
    // already generic (uses 30 min horizon by default for outcome data) -- no
    // need to regenerate. Just update visibility.
  });
}
document.getElementById('reset-stats-btn').addEventListener('click', () => {
  if (!confirm('Reset all stats?')) return;
  stats = { total: 0, correct: 0, streak: 0, bestStreak: 0, byHorizon: {}, byTicker: {} };
  saveStats();
  renderStats();
});

// ============================================================
// BOOT
// ============================================================
(async function boot() {
  renderStats();
  initChart();
  try {
    setLoading('Loading catalog...');
    await loadCatalog();
    if (!CATALOG || CATALOG.length === 0) {
      setLoading('No SOXL/MSTR sessions available.');
      return;
    }
    await nextQuestion();
  } catch (e) {
    console.error(e);
    setLoading('Error: ' + e.message);
  }
})();
</script>
